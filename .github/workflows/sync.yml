name: Sync metadata from contrib

on:
 workflow_dispatch:
 schedule:
    - cron: "30 1 1,15 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_metadata:
    name: Sync metadata
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - name: Clone collector source
        id: collector
        run: |
          collector_path="$RUNNER_TEMP/splunk-otel-collector"
          git clone --depth 1 https://github.com/signalfx/splunk-otel-collector.git "$collector_path"
          echo "path=$collector_path" >> "$GITHUB_OUTPUT"
          echo "go-version=$(awk '$1 == "go" { print $2; exit }' "$collector_path/go.mod")" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.collector.outputs.go-version }}
          cache: false
      - name: Add config schema generator
        run: |
          collector_path="${{ steps.collector.outputs.path }}"
          mkdir -p "$collector_path/cmd/configschema" "$collector_path/internal/configschema"
          cp scripts/cfgschema/main.go "$collector_path/cmd/configschema/main.go"
          cp -R scripts/cfgschema/lib/configschema/. "$collector_path/internal/configschema/"
      - name: Generate settings metadata
        working-directory: ${{ steps.collector.outputs.path }}
        run: |
          go get github.com/fatih/structtag@v1.2.0
          go test ./internal/configschema
          go run ./cmd/configschema -s . -o "$GITHUB_WORKSPACE/cfg-metadata"
      - name: Download metrics from contrib
        run: |
          ./scripts/import_metric_metadata.sh
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'Metada update ${{ steps.date.outputs.date }}'
          new_branch: metadata-update-${{ steps.date.outputs.date }}
          add: '.'
          default_author: github_actor
          push: true
      - name: Create pull request
        run: gh pr create -B main -H metadata-update-${{ steps.date.outputs.date }} --title 'Merge metadata-update-${{ steps.date.outputs.date }} into main' --body 'Automatic sync PR to update reference files from contrib'
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
